apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  labels:
    app: test-pod
spec:
  containers:
    - name: test-container
      image: ghcr.io/${{ github.repository }}/custom-test-image:latest
      command: ["sh", "-c", "echo 'Hello from custom test pod'; sleep 3600"]
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "100m"
