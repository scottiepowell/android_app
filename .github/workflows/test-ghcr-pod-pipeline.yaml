name: OCI & Ephemeral Pod Test Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ghcr-pod-pipeline.yaml"
      - ".github/test/**"
      - "buildozer.spec"

env:
  GH_ACTOR: ${{ github.actor }}
  IMAGE_NAME: "arm64"
  IMAGE_TAG: "v4"

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GHCR so we can push the image
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.GH_ACTOR }}
          password: ${{ secrets.GH_PIPELINE }}

      # Check if the image already exists in GHCR (skip build if so)
      - name: Check if Custom Image Exists in GHCR
        id: check_image
        run: |
          set -e
          IMAGE="ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Checking if image exists: $IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists in GHCR."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist in GHCR."
          fi

      # Build and push to GHCR if it doesn't exist yet
      - name: Build and Push Docker Image
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/build-push-action@v4
        with:
          context: ./.github/test
          file: ./.github/test/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Skip Build as Image Already Exists
        if: steps.check_image.outputs.exists == 'true'
        run: echo "Image already exists, skipping build."

  ephemeral-test:
    needs: build-image
    runs-on: ubuntu-latest
    env:
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install python-dotenv oci

      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" \
            -- --accept-all-defaults --install-dir /usr/local/bin

      - name: Link OCI CLI to PATH
        run: |
          sudo ln -sf /home/runner/bin/oci /usr/local/bin/oci

      - name: Setup OCI Config and Generate Kubeconfig
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          python setup_oci_config.py
          echo "OCI config:"
          cat ~/.oci/config
          
          CLUSTER_ID=$(oci ce cluster list --compartment-id $OCI_TENANCY --query 'data[0].id' --raw-output)
          if [ -z "$CLUSTER_ID" ]; then
            echo "Error: No cluster found!" >&2
            exit 1
          fi
          echo "Found cluster: $CLUSTER_ID"
          
          oci ce cluster create-kubeconfig \
            --cluster-id $CLUSTER_ID \
            --file /tmp/kubeconfig_test \
            --region $OCI_REGION
          
          echo "KUBECONFIG=/tmp/kubeconfig_test" >> $GITHUB_ENV
          echo "Kubeconfig generated successfully."

      - name: Create Ephemeral Namespace
        id: create_ns
        run: |
          EPHEMERAL_NAMESPACE="build-ns-$(date +%s)"
          echo "EPHEMERAL_NAMESPACE=${EPHEMERAL_NAMESPACE}" >> $GITHUB_ENV
          echo "Creating ephemeral namespace: ${EPHEMERAL_NAMESPACE}"
          if ! kubectl create namespace "${EPHEMERAL_NAMESPACE}"; then
            echo "Error: Failed to create namespace ${EPHEMERAL_NAMESPACE}" >&2
            exit 1
          fi

      # Create a docker-registry secret with your GHCR credentials
      # and patch the default service account to use it as imagePullSecrets.
      - name: Create Private GHCR Pull Secret
        run: |
          echo "Creating docker-registry secret in ephemeral namespace for GHCR..."
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ env.GH_ACTOR }}" \
            --docker-password="${{ secrets.GH_PIPELINE }}" \
            --docker-email="someemail@example.com" \
            --namespace="${EPHEMERAL_NAMESPACE}"

          echo "Patching default service account to use the pull secret..."
          kubectl patch serviceaccount default \
            -n "${EPHEMERAL_NAMESPACE}" \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

      - name: Deploy Test Pod Using Custom Image
        id: deploy_pod
        run: |
          echo "Deploying test pod to namespace ${EPHEMERAL_NAMESPACE}"
          IMAGE="ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Using image: $IMAGE"
          
          # Replace IMAGE_PLACEHOLDER in the manifest
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" .github/test/ghcr-test-pod.yaml > /tmp/ghcr-test-pod.yaml
          
          if ! kubectl apply -f /tmp/ghcr-test-pod.yaml --namespace "${EPHEMERAL_NAMESPACE}"; then
            echo "Error: Failed to deploy test pod" >&2
            exit 1
          fi

      - name: Wait for Test Pod to be Ready
        id: wait_pod
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD_NAME" ]; then
            echo "Error: No pod found in namespace ${EPHEMERAL_NAMESPACE}" >&2
            exit 1
          fi
          echo "Waiting for pod ${POD_NAME} to be ready..."
          if ! kubectl wait --for=condition=Ready pod/"${POD_NAME}" \
            --namespace "${EPHEMERAL_NAMESPACE}" --timeout=300s; then
            echo "Error: Pod ${POD_NAME} did not become ready in time" >&2
            kubectl describe pod "${POD_NAME}" --namespace "${EPHEMERAL_NAMESPACE}"
            exit 1
          fi

      - name: Log Test Pod Details
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          echo "Pod details for ${POD_NAME}:"
          kubectl describe pod "${POD_NAME}" --namespace "${EPHEMERAL_NAMESPACE}"


      - name: Copy Source Code to Pod
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          echo "Tar and copy code to container..."
          tar -czf /tmp/src.tar.gz .
          kubectl cp /tmp/src.tar.gz "${EPHEMERAL_NAMESPACE}/${POD_NAME}:/tmp/src.tar.gz"
          kubectl exec -n "${EPHEMERAL_NAMESPACE}" "${POD_NAME}" -- mkdir -p /app
          kubectl exec -n "${EPHEMERAL_NAMESPACE}" "${POD_NAME}" -- tar -xzf /tmp/src.tar.gz -C /app
      
      - name: Verify sdkmanager path in pod
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          echo "Checking for sdkmanager at /root/.buildozer/android/platform/android-sdk/tools/bin..."
          kubectl exec -n "${EPHEMERAL_NAMESPACE}" "$POD_NAME" -- \
            ls -l /root/.buildozer/android/platform/android-sdk/tools/bin || true
     
      - name: Verify ANT installation in pod
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "${EPHEMERAL_NAMESPACE}" "$POD_NAME" -- ant -version
        

      - name: Run Buildozer in Pod
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          echo "Running Buildozer inside the container..."
          # For example, we assume the buildozer.spec is inside /app or /app/android_app:
          kubectl exec -n "${EPHEMERAL_NAMESPACE}" "${POD_NAME}" -- sh -c "cd /app && buildozer android debug"

      - name: Copy APK from Pod
        run: |
          POD_NAME=$(kubectl get pods --namespace "${EPHEMERAL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}')
          echo "Copying APK back to GitHub Actions runner..."
          # Adjust the output path and filenames to match your project
          # Commonly, buildozer might put the APK under /app/bin/<appname>-debug.apk or /app/bin/*.apk
          kubectl cp "${EPHEMERAL_NAMESPACE}/${POD_NAME}:/app/bin" /tmp/apk_bin
          ls -l /tmp/apk_bin

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Built-APK
          path: /tmp/apk_bin

      - name: Cleanup Ephemeral Namespace
        if: always()
        run: |
          echo "Cleaning up: Deleting namespace ${EPHEMERAL_NAMESPACE}"
          if ! kubectl delete namespace "${EPHEMERAL_NAMESPACE}" --wait; then
            echo "Error: Failed to delete namespace ${EPHEMERAL_NAMESPACE}" >&2
            exit 1
          fi