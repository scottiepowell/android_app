name: Android ARM64 Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ghcr-pod-docker-pipeline.yaml"
      - ".github/test/**"

jobs:
# ──────────────────────────────────────────────────────────────────────
  build-p4a-arm64:
    if: false
    name: Build & Push python-for-android ARM64 Image
    runs-on: ubuntu-latest
    env:
      GH_ACTOR:    ${{ github.actor }}
      GHCR_IMAGE:  ghcr.io/${{ github.repository }}/python-for-android:arm64

    outputs:
      image: ${{ env.GHCR_IMAGE }}

    steps:
      - uses: actions/checkout@v3
        with:
          path: docker/p4a

      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.GH_ACTOR }}
          password: ${{ secrets.GH_PIPELINE }}

      - uses: docker/build-push-action@v4
        with:
          context: docker/p4a
          file: docker/p4a/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.GHCR_IMAGE }}

      - name: Export image name
        run: echo "image=${{ env.GHCR_IMAGE }}" >> "$GITHUB_OUTPUT"

# ──────────────────────────────────────────────────────────────────────
  ephemeral-test:
    runs-on: ubuntu-latest
    env:
      EPHEMERAL_IMAGE: ghcr.io/scottiepowell/android_app/python-for-android:arm64
      OCI_USER:        ${{ secrets.OCI_USER }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_TENANCY:     ${{ secrets.OCI_TENANCY }}
      OCI_REGION:      ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE:    /home/runner/.oci/oci_api_key.pem

    steps:
    # ────────────────────────────────────────────────────────────────
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Python deps
      run: pip install python-dotenv oci

    # ── OCI CLI ────────────────────────────────────────────────────
    - name: Install OCI CLI
      run: |
        curl -Ls https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
          | bash -s -- --accept-all-defaults --install-dir /usr/local/bin
    - name: Link OCI into PATH
      run: sudo ln -sf /home/runner/bin/oci /usr/local/bin/oci

    # ── kube-config ────────────────────────────────────────────────
    - name: Setup OCI config & kubeconfig
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        python setup_oci_config.py

        CLUSTER_ID=$(oci ce cluster list \
            --compartment-id "$OCI_TENANCY" \
            --query 'data[0].id' --raw-output)
        oci ce cluster create-kubeconfig \
            --cluster-id "$CLUSTER_ID" \
            --file /tmp/kubeconfig_test \
            --region "$OCI_REGION"
        echo "KUBECONFIG=/tmp/kubeconfig_test" >> "$GITHUB_ENV"

    # ── new namespace ──────────────────────────────────────────────
    - name: Create ephemeral namespace
      run: |
        EPHEMERAL_NAMESPACE="build-ns-$(date +%s)"
        echo "EPHEMERAL_NAMESPACE=$EPHEMERAL_NAMESPACE" >> "$GITHUB_ENV"
        kubectl create namespace "$EPHEMERAL_NAMESPACE"

    # ── GHCR pull secret ───────────────────────────────────────────
    - name: Add GHCR pull secret
      run: |
        kubectl create secret docker-registry ghcr-pull-secret \
          --docker-server=ghcr.io \
          --docker-username="${{ github.actor }}" \
          --docker-password='${{ secrets.GH_PIPELINE }}' \
          --docker-email=noreply@github.com \
          --namespace "$EPHEMERAL_NAMESPACE"
        kubectl patch sa default \
          -n "$EPHEMERAL_NAMESPACE" \
          -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

    # ── *** NEW: register binfmt with tonistiigi/binfmt *** ────────
    - name: Register QEMU binfmt_misc on every node
      run: |
        cat <<'EOF' | kubectl apply -n "$EPHEMERAL_NAMESPACE" -f -
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: qemu-binfmt-register
        spec:
          backoffLimit: 0
          template:
            spec:
              hostPID: true
              restartPolicy: Never
              containers:
                - name: register
                  image: tonistiigi/binfmt:latest
                  args: ["--install", "all"]
                  securityContext:
                    privileged: true
        EOF

    - name: Wait for binfmt registration to finish
      run: |
        set +e
        kubectl wait -n "$EPHEMERAL_NAMESPACE" \
          --for=condition=complete job/qemu-binfmt-register --timeout=120s
        RET=$?
        set -e
        if [ "$RET" -ne 0 ]; then
          echo "::warning::qemu-binfmt-register job did not complete, dumping diagnostics"
          kubectl describe job -n "$EPHEMERAL_NAMESPACE" qemu-binfmt-register || true
          kubectl get pods -n "$EPHEMERAL_NAMESPACE" -l job-name=qemu-binfmt-register || true
          POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -l job-name=qemu-binfmt-register \
                 -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            kubectl logs -n "$EPHEMERAL_NAMESPACE" "$POD" || true
          fi
          exit 1
        fi

    - name: Delete QEMU registration job
      run: kubectl delete job -n "$EPHEMERAL_NAMESPACE" qemu-binfmt-register --wait

    # ── deploy build container ─────────────────────────────────────
    - name: Deploy build pod
      run: |
        sed "s|IMAGE_PLACEHOLDER|${{ env.EPHEMERAL_IMAGE }}|g" \
          .github/test/ghcr-test-pod.yaml \
          > /tmp/ghcr-test-pod.yaml
        kubectl apply -f /tmp/ghcr-test-pod.yaml -n "$EPHEMERAL_NAMESPACE"

        # ── wait for the Pod to become Ready ───────────────────────────────
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
        echo "POD_NAME=$POD" >> "$GITHUB_ENV"

        set +e
        kubectl wait -n "$EPHEMERAL_NAMESPACE"                          \
                --for=condition=ContainersReady pod/"$POD"              \
                --timeout=300s
        READY=$?
        set -e

        if [ "$READY" -ne 0 ]; then
          echo "::warning::Build Pod did not become ready – dumping diagnostics"

          echo "===== kubectl describe pod $POD ====="
          kubectl describe pod "$POD" -n "$EPHEMERAL_NAMESPACE" || true

          echo "===== Last 200 log lines (all containers) ====="
          kubectl logs -n "$EPHEMERAL_NAMESPACE" "$POD" --all-containers --tail=200 || true

          echo "===== Full Pod YAML (for events & status) ====="
          kubectl get pod "$POD" -n "$EPHEMERAL_NAMESPACE" -o yaml || true

          exit 1
        fi

    # --- copy your repo into /app inside the container -------------
    - name: Copy Source Code to Pod
      run: |
          tar -czf /tmp/src.tar.gz .
          kubectl cp /tmp/src.tar.gz "$EPHEMERAL_NAMESPACE/$POD_NAME:/tmp/src.tar.gz"
          kubectl exec -n "$EPHEMERAL_NAMESPACE" "$POD_NAME" -- \
          bash -c 'mkdir -p /app && tar -xzf /tmp/src.tar.gz -C /app'
    
    - name: Build APK with p4a in Pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')

        kubectl exec -n "$EPHEMERAL_NAMESPACE" "$POD" -- bash -euxo pipefail -c '
            # --------------------------- 1. Install deps ----------------------------
            pip3 install --no-cache-dir python-for-android==2024.01.21 cython packaging
            apt-get update && apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless curl unzip autoconf automake libtool pkg-config make gcc g++ \
            autoconf automake libtool m4 pkg-config build-essential libltdl-dev
            
            # point at java 17
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64
            export PATH=$JAVA_HOME/bin:$PATH
            # --------------------------- 2. Android SDK ----------------------------
            export ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}
            CLI_TOOLS_ZIP=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

            # 2a) install cmdline‑tools if sdkmanager is still missing
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
              curl -sSL "$CLI_TOOLS_ZIP" -o /tmp/cli.zip
              unzip -q /tmp/cli.zip -d "$ANDROID_HOME/cmdline-tools/latest"

              # ── fix the extra level created by Google’s ZIP ──────────────────
              if [ -d  "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
                mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"/* \
                  "$ANDROID_HOME/cmdline-tools/latest/"
                rmdir "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
              fi
            fi

            # 2b) make sure sdkmanager is on the PATH
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

            # 2c) accept licences & install what we need
            yes | sdkmanager --licenses || true
            sdkmanager                                  \
              "platform-tools"                           \
              "platforms;android-33"                    \
              "build-tools;33.0.2"                      \
              "ndk;25.2.9519653"

            export NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"

            # --------------------------- 3. Diagnostics ----------------------------
            echo "=== DEBUG: final env ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK_HOME=$NDK_HOME"
            which p4a
            p4a --version
            echo "========================"

            # --------------------------- 4. Build APK ------------------------------
            cd /app
            p4a apk \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$NDK_HOME" \
            --build-tools-version=33.0.2 \
            --dist-name=whats_in_the_box \
            --bootstrap=sdl2 \
            --requirements=kivy,sqlalchemy,click,sqlite3 \
            --arch=arm64-v8a \
            --android-api=33 \
            --package=org.box.whats_in_the_box \
            --name="What'"'"'s in the Box" \
            --version=0.0.1
        '
        
    - name: Copy APK from Pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
        kubectl cp "${EPHEMERAL_NAMESPACE}/${POD}:/root/.local/share/python-for-android/dists/whats_in_the_box/outputs/apk" /tmp/apks
        ls -l /tmp/apks

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Built-APK
        path: /tmp/apk_bin

    # --- clean up --------------------------------------------------
    - name: Cleanup Ephemeral Namespace
      if: always()
      run: |
        kubectl delete ns "$EPHEMERAL_NAMESPACE" --wait