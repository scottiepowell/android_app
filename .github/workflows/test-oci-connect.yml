name: 🔌 OCI Config + Connectivity & Kubernetes Test

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  oci-test:
    runs-on: ubuntu-latest

    env:
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v3

      - name: 🔐 Restore OCI private key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: pip install python-dotenv oci

      - name: 📝 Run setup_oci_config.py
        run: |
          python setup_oci_config.py
          echo "✅ Config generated:"
          cat ~/.oci/config

      - name: 🔍 Test connectivity to OCI (List OKE clusters)
        run: |
          echo "import oci" > test_oci.py
          echo "" >> test_oci.py
          echo "config = oci.config.from_file()" >> test_oci.py
          echo "ce_client = oci.container_engine.ContainerEngineClient(config)" >> test_oci.py
          echo "response = ce_client.list_clusters(compartment_id=config['tenancy'])" >> test_oci.py
          echo "print('✅ Clusters:')" >> test_oci.py
          echo "for c in response.data:" >> test_oci.py
          echo "    print(f'- {c.name} ({c.id})')" >> test_oci.py
          python test_oci.py

      - name: ⚙️ Install kubectl
        run: |
          # Download the latest stable release of kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: 🛠 Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults --install-dir /usr/local/bin

      - name: 🔗 Link OCI CLI to /usr/local/bin
        run: |
          # Create a symlink to make the OCI CLI binary available on the PATH.
          sudo ln -sf /home/runner/bin/oci /usr/local/bin/oci
      
      - name: 📝 Run tests for Node Pools and Namespaces
        run: |
          cat << 'EOF' > test_oci_k8s.py
          import oci
          import subprocess
          import os

          # Load OCI config and create the ContainerEngineClient
          config = oci.config.from_file()
          ce_client = oci.container_engine.ContainerEngineClient(config)
          
          # Retrieve list of clusters
          clusters = ce_client.list_clusters(compartment_id=config['tenancy']).data
          if not clusters:
              print("No clusters found in compartment:", config['tenancy'])
          else:
              print("✅ Clusters:")
              for cluster in clusters:
                  print(f'- {cluster.name} ({cluster.id})')
                  
                  # List node pools for the cluster
                  np_response = ce_client.list_node_pools(compartment_id=config['tenancy'], cluster_id=cluster.id)
                  print("  Node Pools:")
                  if np_response.data:
                      for np in np_response.data:
                          print(f'    - {np.name} ({np.id})')
                  else:
                      print("    No node pools found.")

                  # Create a kubeconfig for the cluster
                  try:
                      kubeconfig_response = ce_client.create_kubeconfig(cluster_id=cluster.id)
                      kubeconfig_path = f'/tmp/kubeconfig_{cluster.id}'
                      with open(kubeconfig_path, 'w') as f:
                          f.write(kubeconfig_response.data.text)
                      # Use kubectl to list namespaces in the cluster
                      result = subprocess.run(
                          ['kubectl', '--kubeconfig', kubeconfig_path, 'get', 'namespaces', '-o', 'jsonpath={.items[*].metadata.name}'],
                          capture_output=True,
                          text=True
                      )
                      if result.returncode == 0:
                          print("  Namespaces:")
                          print("    " + result.stdout)
                      else:
                          print("  Failed to list namespaces. Error:")
                          print(result.stderr)
                  except Exception as e:
                      print(f"  Error retrieving kubeconfig or namespaces for cluster {cluster.id}: {str(e)}")
          EOF
          python test_oci_k8s.py
