name: OCI & Ephemeral Pod Test Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ghcr-pod-pipeline.yaml"
      - ".github/test/**"
      - "buildozer.spec"

env:
  GH_ACTOR: ${{ github.actor }}
  IMAGE_NAME: "arm64"
  IMAGE_TAG: "v27"

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to GHCR so we can push the image
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.GH_ACTOR }}
          password: ${{ secrets.GH_PIPELINE }}

      # Check if the image already exists in GHCR (skip build if so)
      - name: Check if Custom Image Exists in GHCR
        id: check_image
        run: |
          set -e
          IMAGE="ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Checking if image exists: $IMAGE"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image already exists in GHCR."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image does not exist in GHCR."
          fi

      # Build and push to GHCR if it doesn't exist yet
      - name: Build and Push Docker Image
        if: steps.check_image.outputs.exists == 'false'
        uses: docker/build-push-action@v4
        with:
          context: ./.github/test
          file: ./.github/test/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Skip Build as Image Already Exists
        if: steps.check_image.outputs.exists == 'true'
        run: echo "Image already exists, skipping build."

  ephemeral-test:
    needs: build-image
    runs-on: ubuntu-latest

    env:
      # OCI + GHCR creds …
      OCI_USER:          ${{ secrets.OCI_USER }}
      OCI_FINGERPRINT:   ${{ secrets.OCI_FINGERPRINT }}
      OCI_TENANCY:       ${{ secrets.OCI_TENANCY }}
      OCI_REGION:        ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE:      /home/runner/.oci/oci_api_key.pem

    steps:
    # ────────────────────────────────────────────────────────────────
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: pip install python-dotenv oci

    # --- OCI CLI installation (unchanged) --------------------------
    - name: Install OCI CLI
      run: |
        curl -Ls https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh |
          bash -s -- --accept-all-defaults --install-dir /usr/local/bin
    - name: Link OCI CLI to PATH
      run: sudo ln -sf /home/runner/bin/oci /usr/local/bin/oci

    # --- generate kube‑config (unchanged) --------------------------
    - name: Setup OCI Config and Generate Kubeconfig
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        python setup_oci_config.py

        CLUSTER_ID=$(oci ce cluster list \
                      --compartment-id "$OCI_TENANCY" \
                      --query 'data[0].id' --raw-output)
        echo "Found cluster: $CLUSTER_ID"

        oci ce cluster create-kubeconfig \
          --cluster-id "$CLUSTER_ID" \
          --file /tmp/kubeconfig_test \
          --region "$OCI_REGION"

        echo "KUBECONFIG=/tmp/kubeconfig_test" >> "$GITHUB_ENV"

    # --- create an ephemeral namespace -----------------------------
    - name: Create Ephemeral Namespace
      run: |
        EPHEMERAL_NAMESPACE="build-ns-$(date +%s)"
        echo "EPHEMERAL_NAMESPACE=$EPHEMERAL_NAMESPACE" >> "$GITHUB_ENV"
        kubectl create ns "$EPHEMERAL_NAMESPACE"

    # --- GHCR pull secret so the cluster can pull your image -------
    - name: Create Private GHCR Pull Secret
      run: |
        kubectl create secret docker-registry ghcr-pull-secret \
          --docker-server=ghcr.io \
          --docker-username="${{ github.actor }}" \
          --docker-password='${{ secrets.GH_PIPELINE }}' \
          --docker-email=noreply@github.com \
          --namespace "$EPHEMERAL_NAMESPACE"

        kubectl patch sa default \
          -n "$EPHEMERAL_NAMESPACE" \
          -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

    # --- deploy the (arm64) build container ------------------------
    - name: Deploy Test Pod Using Kivy’s p4a image
      run: |
        IMAGE=ghcr.io/kivy/python-for-android:latest
        sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" .github/test/ghcr-test-pod.yaml \
          > /tmp/ghcr-test-pod.yaml
        kubectl apply -f /tmp/ghcr-test-pod.yaml -n "$EPHEMERAL_NAMESPACE"
    
    # --- wait for container(s) to be ready -------------------------
    - name: Wait for Test Pod to be Ready
      id: wait_pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
        echo "POD_NAME=$POD" >> "$GITHUB_ENV"

        set +e
        kubectl wait \
          --for=condition=ContainersReady \
          --timeout=300s pod/"$POD" -n "$EPHEMERAL_NAMESPACE"
        READY=$?
        set -e

        if [ "$READY" -ne 0 ]; then
          echo "::warning::Pod did not reach ContainersReady – dumping logs"
          kubectl logs "$POD" -n "$EPHEMERAL_NAMESPACE" || true
          kubectl describe pod "$POD" -n "$EPHEMERAL_NAMESPACE" || true
          exit 1
        fi

    # --- copy your repo into /app inside the container -------------
    - name: Copy Source Code to Pod
      run: |
        tar -czf /tmp/src.tar.gz .
        kubectl cp /tmp/src.tar.gz "$EPHEMERAL_NAMESPACE/$POD_NAME:/tmp/src.tar.gz"
        kubectl exec -n "$EPHEMERAL_NAMESPACE" "$POD_NAME" -- \
          bash -c 'mkdir -p /app && tar -xzf /tmp/src.tar.gz -C /app'
    
    - name: Build APK with p4a
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" \
              -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n "$EPHEMERAL_NAMESPACE" "$POD" -- bash -c '
          set -e
    
          # point p4a at our SDK/NDK
          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDNDK="$NDK_HOME"
    
          # *** RUNTIME STUBS for p4a ***
          mkdir -p "$ANDROID_HOME/tools/bin"
          ln -sf "$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager" \
                "$ANDROID_HOME/tools/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/tools"
          printf '\''#!/usr/bin/env sh\nexit 0'\'' \
            > "$ANDROID_HOME/tools/android"
          chmod +x "$ANDROID_HOME/tools/android"
    
          # verify
          echo "--- SDKROOT content ---"
          ls -R "$ANDROID_HOME" | sed -e "s|$ANDROID_HOME|SDKROOT|g" | head -n 30
    
          echo "--- sdkmanager version ---"
          which sdkmanager && sdkmanager --version
    
          echo "--- installed platforms ---"
          sdkmanager --list | grep "platforms;android" || true
          echo "--------------------------"

          echo "--- FOLDERS IN \$ANDROID_HOME (SDKROOT) ---"
          find "$ANDROID_HOME" -maxdepth 2 -type d | sed "s|$ANDROID_HOME|SDKROOT|g"

          echo "--- CONTENTS OF SDKROOT/platforms ---"
          ls -l "$ANDROID_HOME/platforms" || true

          echo "--- CONTENTS OF SDKROOT/platforms/android-33 ---"
          ls -l "$ANDROID_HOME/platforms/android-33" || true

          echo "--- SDKROOT/platforms/android-33/source.properties ---"
          cat "$ANDROID_HOME/platforms/android-33/source.properties" || true

          cd /app
    
          p4a apk \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROIDNDK" \
            --build-tools-version=33.0.2 \
            --dist-name=whats_in_the_box \
            --bootstrap=sdl2 \
            --requirements=kivy,sqlalchemy,click,sqlite3 \
            --arch=arm64-v8a \
            --android-api=33 \
            --package=org.box.whats_in_the_box \
            --name="What'\''s in the Box" \
            --version=0.0.1
        '
                
        
    - name: Copy APK from Pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
        kubectl cp "${EPHEMERAL_NAMESPACE}/${POD}:/root/.local/share/python-for-android/dists/whats_in_the_box/outputs/apk" /tmp/apks
        ls -l /tmp/apks

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Built-APK
        path: /tmp/apk_bin

    # --- clean up --------------------------------------------------
    - name: Cleanup Ephemeral Namespace
      if: always()
      run: |
        kubectl delete ns "$EPHEMERAL_NAMESPACE" --wait
