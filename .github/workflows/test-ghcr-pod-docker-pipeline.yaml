name: Android ARM64 Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ghcr-pod-docker-pipeline.yaml"
      - ".github/test/**"

jobs:
  # ──────────────────────────────────────────────────────────────────────
  build-p4a-arm64:
    if: false
    name: Build & Push python-for-android ARM64 Image
    runs-on: ubuntu-latest
    env:
      GH_ACTOR:    ${{ github.actor }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}/python-for-android:arm64
  
    outputs:
        image: ${{ env.GHCR_IMAGE }}

    steps:
      - name: Checkout python-for-android dockerfile
        uses: actions/checkout@v3
        with:
          path: docker/p4a

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.GH_ACTOR }}
          password: ${{ secrets.GH_PIPELINE }}

      - name: Build & push ARM64 image
        uses: docker/build-push-action@v4
        with:
          context: docker/p4a
          file: docker/p4a/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.GHCR_IMAGE }}

      - name: Export image name
        run: echo "image=${{ env.GHCR_IMAGE }}" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────────────

  ephemeral-test:
    #needs: build-p4a-arm64
    runs-on: ubuntu-latest
    env:
      EPHEMERAL_IMAGE: ghcr.io/scottiepowell/android_app/python-for-android:latest
      # OCI + GHCR creds …
      OCI_USER:          ${{ secrets.OCI_USER }}
      OCI_FINGERPRINT:   ${{ secrets.OCI_FINGERPRINT }}
      OCI_TENANCY:       ${{ secrets.OCI_TENANCY }}
      OCI_REGION:        ${{ secrets.OCI_REGION }}
      OCI_KEY_FILE:      /home/runner/.oci/oci_api_key.pem

    steps:
    # ────────────────────────────────────────────────────────────────
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: pip install python-dotenv oci

    # --- OCI CLI installation (unchanged) --------------------------
    - name: Install OCI CLI
      run: |
        curl -Ls https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh |
          bash -s -- --accept-all-defaults --install-dir /usr/local/bin
    - name: Link OCI CLI to PATH
      run: sudo ln -sf /home/runner/bin/oci /usr/local/bin/oci

    # --- generate kube‑config (unchanged) --------------------------
    - name: Setup OCI Config and Generate Kubeconfig
      run: |
        mkdir -p ~/.oci
        echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
        chmod 600 ~/.oci/oci_api_key.pem
        python setup_oci_config.py

        CLUSTER_ID=$(oci ce cluster list \
                      --compartment-id "$OCI_TENANCY" \
                      --query 'data[0].id' --raw-output)
        echo "Found cluster: $CLUSTER_ID"

        oci ce cluster create-kubeconfig \
          --cluster-id "$CLUSTER_ID" \
          --file /tmp/kubeconfig_test \
          --region "$OCI_REGION"

        echo "KUBECONFIG=/tmp/kubeconfig_test" >> "$GITHUB_ENV"

    # --- create an ephemeral namespace -----------------------------
    - name: Create Ephemeral Namespace
      run: |
        EPHEMERAL_NAMESPACE="build-ns-$(date +%s)"
        echo "EPHEMERAL_NAMESPACE=$EPHEMERAL_NAMESPACE" >> "$GITHUB_ENV"
        kubectl create ns "$EPHEMERAL_NAMESPACE"

    # --- GHCR pull secret so the cluster can pull your image -------
    - name: Create Private GHCR Pull Secret
      run: |
        kubectl create secret docker-registry ghcr-pull-secret \
          --docker-server=ghcr.io \
          --docker-username="${{ github.actor }}" \
          --docker-password='${{ secrets.GH_PIPELINE }}' \
          --docker-email=noreply@github.com \
          --namespace "$EPHEMERAL_NAMESPACE"

        kubectl patch sa default \
          -n "$EPHEMERAL_NAMESPACE" \
          -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

    # --- register QEMU emulation on your ARM nodes -------------
    - name: Register QEMU emulation on cluster
      run: |
        # apply the QEMU binfmt_misc registration as a DaemonSet
        cat <<EOF | kubectl apply -n "$EPHEMERAL_NAMESPACE" -f -
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: qemu-user-static
          namespace: $EPHEMERAL_NAMESPACE
          labels:
            app: qemu-user-static
        spec:
          selector:
            matchLabels:
              app: qemu-user-static
          template:
            metadata:
              labels:
                app: qemu-user-static
            spec:
              initContainers:
                - name: qemu-user-static
                  image: multiarch/qemu-user-static:latest
                  args: ["--reset","-p","yes"]
                  securityContext:
                    privileged: true
              # a tiny “pause” container so the DaemonSet pod stays alive
              containers:
                - name: pause
                  image: k8s.gcr.io/pause:3.5
                  resources:
                    requests:
                      cpu: 50m
                      memory: 50Mi
                    limits:
                      cpu: 50m
                      memory: 50Mi
        EOF


    # --- deploy the (arm64) build container ------------------------
    - name: Deploy Test Pod Using ARM64 p4a image
      run: |
        sed "s|IMAGE_PLACEHOLDER|${{ env.EPHEMERAL_IMAGE }}|g" \
          .github/test/ghcr-test-pod.yaml \
          > /tmp/ghcr-test-pod.yaml
        kubectl apply -f /tmp/ghcr-test-pod.yaml -n "$EPHEMERAL_NAMESPACE"
    
    # --- wait for container(s) to be ready -------------------------
    - name: Wait for Test Pod to be Ready
      id: wait_pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
        echo "POD_NAME=$POD" >> "$GITHUB_ENV"

        set +e
        kubectl wait \
          --for=condition=ContainersReady \
          --timeout=300s pod/"$POD" -n "$EPHEMERAL_NAMESPACE"
        READY=$?
        set -e

        if [ "$READY" -ne 0 ]; then
          echo "::warning::Pod did not reach ContainersReady – dumping logs"
          kubectl logs "$POD" -n "$EPHEMERAL_NAMESPACE" || true
          kubectl describe pod "$POD" -n "$EPHEMERAL_NAMESPACE" || true
          exit 1
        fi

    # --- copy your repo into /app inside the container -------------
    - name: Copy Source Code to Pod
      run: |
          tar -czf /tmp/src.tar.gz .
          kubectl cp /tmp/src.tar.gz "$EPHEMERAL_NAMESPACE/$POD_NAME:/tmp/src.tar.gz"
          kubectl exec -n "$EPHEMERAL_NAMESPACE" "$POD_NAME" -- \
          bash -c 'mkdir -p /app && tar -xzf /tmp/src.tar.gz -C /app'
    
    - name: Build APK with p4a in Pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')

        kubectl exec -n "$EPHEMERAL_NAMESPACE" "$POD" -- bash -euxo pipefail -c '
            # --------------------------- 1. Install deps ----------------------------
            pip3 install --no-cache-dir python-for-android==2024.01.21 cython packaging
            apt-get update && apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless curl unzip autoconf automake libtool pkg-config make gcc g++ \
            autoconf automake libtool m4 pkg-config build-essential libltdl-dev
            
            # point at java 17
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64
            export PATH=$JAVA_HOME/bin:$PATH
            # --------------------------- 2. Android SDK ----------------------------
            export ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}
            CLI_TOOLS_ZIP=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

            # 2a) install cmdline‑tools if sdkmanager is still missing
            if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
              curl -sSL "$CLI_TOOLS_ZIP" -o /tmp/cli.zip
              unzip -q /tmp/cli.zip -d "$ANDROID_HOME/cmdline-tools/latest"

              # ── fix the extra level created by Google’s ZIP ──────────────────
              if [ -d  "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
                mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"/* \
                  "$ANDROID_HOME/cmdline-tools/latest/"
                rmdir "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"
              fi
            fi

            # 2b) make sure sdkmanager is on the PATH
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

            # 2c) accept licences & install what we need
            yes | sdkmanager --licenses || true
            sdkmanager                                  \
              "platform-tools"                           \
              "platforms;android-33"                    \
              "build-tools;33.0.2"                      \
              "ndk;25.2.9519653"

            export NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"

            # --------------------------- 3. Diagnostics ----------------------------
            echo "=== DEBUG: final env ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK_HOME=$NDK_HOME"
            which p4a
            p4a --version
            echo "========================"

            # --------------------------- 4. Build APK ------------------------------
            cd /app
            p4a apk \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$NDK_HOME" \
            --build-tools-version=33.0.2 \
            --dist-name=whats_in_the_box \
            --bootstrap=sdl2 \
            --requirements=kivy,sqlalchemy,click,sqlite3 \
            --arch=arm64-v8a \
            --android-api=33 \
            --package=org.box.whats_in_the_box \
            --name="What'"'"'s in the Box" \
            --version=0.0.1
        '
        
    - name: Copy APK from Pod
      run: |
        POD=$(kubectl get pods -n "$EPHEMERAL_NAMESPACE" -o jsonpath='{.items[0].metadata.name}')
        kubectl cp "${EPHEMERAL_NAMESPACE}/${POD}:/root/.local/share/python-for-android/dists/whats_in_the_box/outputs/apk" /tmp/apks
        ls -l /tmp/apks

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Built-APK
        path: /tmp/apk_bin

    # --- clean up --------------------------------------------------
    - name: Cleanup Ephemeral Namespace
      if: always()
      run: |
        kubectl delete ns "$EPHEMERAL_NAMESPACE" --wait