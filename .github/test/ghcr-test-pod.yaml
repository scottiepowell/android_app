apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  labels:
    app: test-pod
spec:
  containers:
    - name: test-container
      image: IMAGE_PLACEHOLDER
      command: ["sh", "-c", "echo 'Hello from custom test pod'; sleep 3600"]
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
          cpu: "1"
