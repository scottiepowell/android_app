name: Terraform Build and Destroy

on:
  push:
    paths:
      - ".github/workflows/test-terraform.yml"
      - ".github/test/main.tf"
  workflow_dispatch:

env:
  TF_VAR_key_name:           ${{ secrets.AWS_KEY_NAME }}
  TF_VAR_ssh_public_key:     ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_private_key:    ${{ secrets.SSH_PRIVATE_KEY }}
  TF_VAR_create_key_pair:    false
  AWS_ACCESS_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-ec2:
    name: Provision EC2 via Terraform
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.provision.outputs.instance_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: .github/test
        run: terraform init

      - name: Terraform Apply
        id: provision
        working-directory: .github/test
        shell: bash
        run: |
            # send all TF’s debug logs (stderr) into a file
            export TF_LOG=DEBUG
            export TF_LOG_PATH="$RUNNER_WORKSPACE/terraform-debug.log"
            terraform apply -auto-approve -no-color
            ip=$(terraform output -raw instance_ip | head -n1 | tr -d '\r')
            # *only* write the name=value into the GITHUB_OUTPUT file
            echo "instance_ip=$ip" >> "$GITHUB_OUTPUT"
      
      - name: Test SSH connectivity
        run: |
          echo "$TF_VAR_ssh_private_key" > key.pem
          chmod 600 key.pem

          ssh -vvv -o StrictHostKeyChecking=no \
            -i key.pem ec2-user@${{ steps.provision.outputs.instance_ip }} \
            echo "SSH OK"

      - name: Build on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ steps.provision.outputs.instance_ip }} << 'EOF'
            # any commands you want—will run until they finish or you manually time out
            echo 'Hello from instance!' && hostname
            echo hello > /tmp/dummy.apk
            chmod 644 /tmp/dummy.apk
            # …your buildozer or colcon build commands here…
          EOF

  destroy-ec2:
    name: Destroy EC2 via Terraform
    runs-on: ubuntu-latest
    needs: build-ec2
    if: needs.build-ec2.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: .github/test
        run: terraform init

      - name: Terraform Destroy
        working-directory: .github/test
        run: terraform destroy -auto-approve