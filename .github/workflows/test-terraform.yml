name: Terraform Build and Destroy

on:
  push:
    paths:
      - ".github/workflows/test-terraform.yml"
      - ".github/test/main.tf"
  workflow_dispatch:

env:
  TF_VAR_key_name:        ${{ secrets.AWS_KEY_NAME }}
  TF_VAR_ssh_public_key:  ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
  AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-ec2:
    name: Provision EC2 via Terraform
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.provision.outputs.instance_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: .github/test
        run: terraform init

      - name: Terraform Apply
        id: provision
        working-directory: .github/test
        run: |
          # enable detailed Terraform logging
          export TF_LOG=DEBUG
          export TF_LOG_PATH="$RUNNER_WORKSPACE/terraform-debug.log"
          terraform apply -auto-approve

          # capture the IP for downstream steps
          echo "::set-output name=instance_ip::$(terraform output -raw instance_ip)"

      - name: Test SSH connectivity
        working-directory: .github/test
        run: |
          # write out the private key from our TF_VAR
          echo "$TF_VAR_ssh_private_key" > key.pem
          chmod 600 key.pem

          # verbose SSH probe
          ssh -vvv -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ steps.provision.outputs.instance_ip }} \
            echo "SSH works!"

  destroy-ec2:
    name: Destroy EC2 via Terraform
    runs-on: ubuntu-latest
    needs: build-ec2
    if: needs.build-ec2.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: .github/test
        run: terraform init

      - name: Terraform Destroy
        working-directory: .github/test
        run: terraform destroy -auto-approve