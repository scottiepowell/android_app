name: Android ARM64 Build

on:
  push:
    paths:
      - ".github/workflows/test-terraform.yml"
      - ".github/test/main.tf"
      - ".github/docker/Dockerfile.buildozer"
      - "buildozer.spec"
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION:  us-east-1
  TF_VAR_key_name:     ${{ secrets.AWS_KEY_NAME }}
  TF_VAR_ssh_public_key:  ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
  TF_VAR_create_key_pair: false
  AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}

################################################################################
# 1️⃣  BUILD EC2 ───────────────────────────────────────────────────────────────
################################################################################
jobs:
  build-ec2:
    if: false          # ← flip to true (or remove) when you want this to run
    runs-on: ubuntu-latest

    outputs:
      instance_ip:    ${{ steps.provision.outputs.instance_ip }}
      instance_id:    ${{ steps.provision.outputs.instance_id }}

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with: { terraform_version: "1.11.4" }

      - name: Terraform Init
        run: terraform -chdir=.github/test init

      - name: Terraform Apply & capture outputs
        id: provision
        shell: bash
        run: |
          TF_BIN="$TERRAFORM_CLI_PATH/terraform-bin"
          "$TF_BIN" -chdir=.github/test apply -auto-approve -no-color

          ip=$("$TF_BIN" -chdir=.github/test output -raw instance_ip  | head -n1 | tr -d '\r')
          id=$("$TF_BIN" -chdir=.github/test output -raw instance_id  | head -n1 | tr -d '\r')
          echo "instance_ip=$ip" >> "$GITHUB_OUTPUT"
          echo "instance_id=$id" >> "$GITHUB_OUTPUT"
          
      - name: Write private key
        run: |
          echo "$TF_VAR_ssh_private_key" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Wait for instance-status-ok
        run: |
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.provision.outputs.instance_id }}"

      - name: Poll port 22 until open
        shell: bash
        run: |
          IP=${{ steps.provision.outputs.instance_ip }}
          for i in {1..50}; do
            if nc -z -w2 "$IP" 22; then echo "SSH port open 🍀"; exit 0; fi
            echo "[$i/50] port 22 still closed…"; sleep 10
          done
          exit 1

      # Allow env-vars to pass through sshd once per host 
      - name: Enable env-pass-through in sshd
        shell: bash
        env:
            IP: ${{ steps.provision.outputs.instance_ip }}
        run: |
            ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@$IP <<'REMOTE'
            set -e
            # Add AcceptEnv only if it's missing
            sudo grep -q "AcceptEnv DOCKERHUB_USER DOCKERHUB_TOKEN" /etc/ssh/sshd_config || \
                sudo bash -c 'echo "AcceptEnv DOCKERHUB_USER DOCKERHUB_TOKEN" >> /etc/ssh/sshd_config'
            sudo systemctl restart sshd
            REMOTE

      # Save tfstate for later jobs
      - name: Upload terraform state
        uses: actions/upload-artifact@v4
        with:
          name: tfstate
          path: |
            .github/test/terraform.tfstate
            .github/test/terraform.lock.hcl

  ##########################################################################
  # 2️⃣  CONFIGURE EC2 – copy code, build APK, copy it back
  ##########################################################################
  configure-ec2:
    if: true            # flip to true / remove to enable
    runs-on: ubuntu-latest
    #needs: build-ec2
    steps:
      - uses: actions/checkout@v3

      - name: Write private key
        run: |
          echo "$TF_VAR_ssh_private_key" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Lookup EC2 instance by tag
        id: ec2
        shell: bash
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=buildozer-host" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "instance_ip=$INSTANCE_IP" >> "$GITHUB_OUTPUT"

      # 1. Copy source tree as tar.gz onto the EC2 instance
      - name: Copy source to EC2
        shell: bash
        env:
          IP: ${{ steps.ec2.outputs.instance_ip }}
        run: |
          tar -czf /tmp/src.tar.gz .
          scp -o StrictHostKeyChecking=no -i key.pem /tmp/src.tar.gz ec2-user@$IP:/tmp/src.tar.gz
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@$IP \
            'mkdir -p ~/app && tar -xzf /tmp/src.tar.gz -C ~/app'

      # ------------------------------------------------------------------
      # 1️⃣  Build + push the custom Buildozer image on the runner
      # ------------------------------------------------------------------
      - name: Build & push Buildozer image
        env:
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/buildozer-local:latest
        run: |
            docker build -t $IMAGE_TAG \
                -f .github/docker/Dockerfile.buildozer .
            echo ${{ secrets.GH_PIPELINE }} | \
                docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker push $IMAGE_TAG

        # ------------------------------------------------------------------
        # 2️⃣  Build APK on the EC2 host with that image
        # ------------------------------------------------------------------
      - name: Build APK on EC2 via Buildozer container
        env:
          IP: ${{ steps.ec2.outputs.instance_ip }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/buildozer-local:latest
          GHCR_TOKEN: ${{ secrets.GH_PIPELINE }}
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@$IP << REMOTE
            set -euo pipefail

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u ${{ github.actor }}  --password-stdin

            # pull the pre-baked image
            sudo docker pull ${IMAGE_TAG}

            cd ~/app
            sudo docker run --rm \
            -v "\$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            ${IMAGE_TAG} \
            android debug
          REMOTE
          
      # 3. Copy the generated APK back to the runner
      - name: Copy APK from EC2
        shell: bash
        env:
          IP: ${{ steps.ec2.outputs.instance_ip }}
        run: |
          mkdir -p /tmp/apks
          scp -o StrictHostKeyChecking=no -i key.pem \
              "ec2-user@$IP:/root/.local/share/python-for-android/dists/whats_in_the_box/outputs/apk/*" \
              "ec2-user@$IP:~/app/bin/*.apk" \
              /tmp/apks/

      # 4. Upload APK as artifact
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Built-APK
          path: /tmp/apks

################################################################################
# 3️⃣  DESTROY EC2 ─────────────────────────────────────────────────────────────
################################################################################
  destroy-ec2:
    if: false          # ← flip to true (or remove) when you want this to run
    runs-on: ubuntu-latest
    needs: configure-ec2

    steps:
      - uses: actions/checkout@v3

      - name: Download terraform state
        uses: actions/download-artifact@v4
        with:
          name: tfstate
          path: .github/test

      - uses: hashicorp/setup-terraform@v2
        with: { terraform_version: "1.11.4" }

      - name: Terraform Init
        run: terraform -chdir=.github/test init -input=false

      - name: Terraform Destroy
        run: terraform -chdir=.github/test destroy -auto-approve -input=false