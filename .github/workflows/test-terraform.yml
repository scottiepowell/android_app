name: Terraform Build and Destroy

on:
  push:
    paths:
      - ".github/workflows/test-terraform.yml"
      - ".github/test/main.tf"
  workflow_dispatch:

env:
  TF_VAR_key_name:           ${{ secrets.AWS_KEY_NAME }}
  TF_VAR_ssh_public_key:     ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_private_key:    ${{ secrets.SSH_PRIVATE_KEY }}
  TF_VAR_create_key_pair:    false
  AWS_ACCESS_KEY_ID:         ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  build-ec2:
    name: Provision EC2 via Terraform
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.provision.outputs.instance_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: .github/test
        run: terraform init

      - name: Terraform Apply
        id: provision
        working-directory: .github/test
        shell: bash
        run: |
            TF_BIN="$TERRAFORM_CLI_PATH/terraform-bin"
            [[ -x "$TF_BIN" ]] || { echo "Binary not found: $TF_BIN" ; exit 1 ; }
            export TF_LOG=DEBUG
            export TF_LOG_PATH="$RUNNER_WORKSPACE/terraform-debug.log"
            "$TF_BIN" apply -auto-approve -no-color
            ip=$("$TF_BIN" output -raw instance_ip | head -n1 | tr -d '\r')
            # *only* write the name=value into the GITHUB_OUTPUT file
            echo "instance_ip=$ip" >> "$GITHUB_OUTPUT"

            id=$("$TF_BIN" output -raw instance_id | head -n1 | tr -d '\r')
            echo "instance_id=$id" >> "$GITHUB_OUTPUT"
        
      - name: Wait for AWS “instance-status-ok”
        shell: bash
        run: |
          #IP="${{ steps.provision.outputs.instance_id }}"
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.provision.outputs.instance_id }}"
                      
      - name: Show instance networking + SG
        run: |
            aws ec2 describe-instances --instance-ids "${{ steps.provision.outputs.instance_id }}" --output table \
            --query "Reservations[0].Instances[0].[PublicIpAddress,SubnetId,VpcId,State.Name,SecurityGroups]"

      - name: Poll port 22 until open
        run: |
            IP=${{ steps.provision.outputs.instance_ip }}
            for i in $(seq 1 20); do
            if nc -z -w2 $IP 22 2>/dev/null; then echo "SSH port open 🍀"; exit 0; fi
            echo "[$i/20] port 22 still closed…"; sleep 5
            done
            echo "::error::Port 22 never opened on $IP"; exit 1
      
      - name: Write private key
        shell: bash
        run: |
          # decode the base64-encoded PEM secret; remove `base64 -d` if you use literal PEM
          echo "$TF_VAR_ssh_private_key" | base64 -d > key.pem
          chmod 600 key.pem
      
      - name: Test SSH connectivity (verbose)
        shell: bash
        run: |
          IP="${{ steps.provision.outputs.instance_ip }}"
          ssh -vvv -o StrictHostKeyChecking=no -i key.pem ec2-user@$IP echo "SSH OK"

      - name: Build on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ steps.provision.outputs.instance_ip }} << 'EOF'
            # any commands you want—will run until they finish or you manually time out
            echo 'Hello from instance!' && hostname
            echo hello > /tmp/dummy.apk
            chmod 644 /tmp/dummy.apk
            # …your buildozer or colcon build commands here…
          EOF

  destroy-ec2:
    name: Destroy EC2 via Terraform
    runs-on: ubuntu-latest
    needs: build-ec2
    if: needs.build-ec2.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        working-directory: .github/test
        run: terraform init

      - name: Terraform Destroy
        working-directory: .github/test
        run: terraform destroy -auto-approve