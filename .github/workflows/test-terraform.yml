name: Terraform Build and Destroy

on:
  push:
    paths:
      - ".github/workflows/test-terraform.yml"
      - ".github/test/main.tf"
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_key_name:        ${{ secrets.AWS_KEY_NAME }}
  TF_VAR_ssh_public_key:  ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
  TF_VAR_create_key_pair: false
  AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build-ec2:
    runs-on: ubuntu-latest
    outputs:
      instance_ip:     ${{ steps.provision.outputs.instance_ip }}
      instance_id:     ${{ steps.provision.outputs.instance_id }}
      igw_id:          ${{ steps.provision.outputs.igw_id }}
      route_table_id:  ${{ steps.provision.outputs.route_table_id }}
      subnet_assoc_id: ${{ steps.provision.outputs.subnet_assoc_id }}

    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform -chdir=.github/test init

      - name: Terraform Apply & capture outputs
        id: provision
        shell: bash
        run: |
          TF_BIN="$TERRAFORM_CLI_PATH/terraform-bin"

          # apply
          "$TF_BIN" -chdir=.github/test apply -auto-approve -no-color

          # capture + trim CR/LF reliably
          ip=$("$TF_BIN" -chdir=.github/test output -raw instance_ip            | head -n1 | tr -d '\r')
          id=$("$TF_BIN" -chdir=.github/test output -raw instance_id            | head -n1 | tr -d '\r')
          igw=$("$TF_BIN" -chdir=.github/test output -raw internet_gateway_id   | head -n1 | tr -d '\r')
          rt=$("$TF_BIN" -chdir=.github/test output -raw route_table_id         | head -n1 | tr -d '\r')
          #assoc=$("$TF_BIN" -chdir=.github/test output -raw subnet_association_id | head -n1 | tr -d '\r')

          {
            echo "instance_ip=$ip"
            echo "instance_id=$id"
            echo "igw_id=$igw"
            echo "route_table_id=$rt"
            #echo "subnet_assoc_id=$assoc"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for instance-status-ok
        shell: bash
        run: |
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.provision.outputs.instance_id }}"
          aws ec2 describe-instances --instance-ids "${{ steps.provision.outputs.instance_id }}" \
            --query "Reservations[0].Instances[0].SecurityGroups" --output table

      - name: Poll port 22 until open
        shell: bash
        run: |
          IP=${{ steps.provision.outputs.instance_ip }}
          for i in {1..50}; do
            if nc -z -w2 "$IP" 22; then echo "SSH port open 🍀"; exit 0; fi
            echo "[$i/50] port 22 still closed…"; sleep 10
          done
          echo "::error::Port 22 never opened on $IP"; exit 1

      - name: Write private key
        shell: bash
        run: |
          echo "$TF_VAR_ssh_private_key" | base64 -d > key.pem
          chmod 600 key.pem

      - name: Test SSH connectivity
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ steps.provision.outputs.instance_ip }} echo "SSH OK"

      - name: Run remote build commands
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ec2-user@${{ steps.provision.outputs.instance_ip }} <<'EOF'
            echo "Hello from $(hostname)"
            echo "dummy APK content" > /tmp/dummy.apk
            chmod 644 /tmp/dummy.apk
          EOF

  destroy-ec2:
    runs-on: ubuntu-latest
    needs: build-ec2
    if: needs.build-ec2.result == 'success'

    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.11.4"
      - name: Terraform Destroy
        run: terraform -chdir=.github/test destroy -auto-approve